[workspace]
resolver = "3"
members = ["crates/render-ir", "crates/render-core", "crates/paginate", "crates/pdf-out", "crates/raster-out", "crates/cdp-server"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
render-ir = { path = "crates/render-ir" }
render-core = { path = "crates/render-core" }
paginate = { path = "crates/paginate" }
pdf-out = { path = "crates/pdf-out" }
raster-out = { path = "crates/raster-out" }
cdp-server = { path = "crates/cdp-server" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Fat LTO with a single codegen unit: the whole program, including blitz,
# usvg, resvg and the image codecs, is optimized as one unit. It is the slow
# end of the build-time scale and the fast end of the runtime one, which is the
# right trade for a binary built once and served many times.
#
# This used to be paired with a PGO build. It was dropped: once the hot path it
# was optimizing (comparing font files byte by byte on every glyph run) was
# gone, PGO measured level with or slower than plain release, and it cost an
# instrument-run-rebuild cycle on every CI run.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Release with symbols: dhat can only attribute an allocation if it can resolve
# the stack, and release strips them.
[profile.profiling]
inherits = "release"
debug = true
strip = false