[workspace]
resolver = "3"
members = ["crates/render-ir", "crates/render-core", "crates/paginate", "crates/pdf-out", "crates/raster-out", "crates/cdp-server"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
render-ir = { path = "crates/render-ir" }
render-core = { path = "crates/render-core" }
paginate = { path = "crates/paginate" }
pdf-out = { path = "crates/pdf-out" }
raster-out = { path = "crates/raster-out" }
cdp-server = { path = "crates/cdp-server" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Instrumented build: only used to collect profiles, never shipped. No LTO and
# many codegen units, because fat LTO on the instrumented IR is what blows the
# builder's memory (all of blitz/usvg/resvg/image bitcode in one process).
# Release com símbolos: o dhat só sabe atribuir uma alocação se conseguir
# resolver a pilha, e o release normal tira os símbolos.
[profile.profiling]
inherits = "release"
debug = true
strip = false

[profile.pgo-gen]
inherits = "release"
lto = false
codegen-units = 16
strip = false

# Optimized build, driven by the collected profiles. Thin LTO instead of fat:
# it is parallel and per-module, so the peak is a fraction of fat's, and with
# PGO on top the result lands within noise of fat LTO alone.
# BOLT needs the symbols and the relocations, hence strip = false.
[profile.pgo]
inherits = "release"
lto = "thin"
codegen-units = 16
strip = false