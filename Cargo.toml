[workspace]
resolver = "3"
members = ["crates/render-ir", "crates/render-core", "crates/paginate", "crates/pdf-out"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
render-ir = { path = "crates/render-ir" }
render-core = { path = "crates/render-core" }
paginate = { path = "crates/paginate" }
pdf-out = { path = "crates/pdf-out" }
