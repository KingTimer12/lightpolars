name: Build and Push Docker Image

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:
    inputs:
      bolt:
        description: "Also apply BOLT on top of PGO (x86-64 only)"
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: plain
            dockerfile: ./Dockerfile
            tag: latest
            sha_prefix: ""
          - variant: pgo
            dockerfile: ./pgo.Dockerfile
            tag: pgo
            sha_prefix: "pgo-"

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: |
            ENABLE_BOLT=${{ inputs.bolt && '1' || '0' }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/lightpolars:${{ matrix.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/lightpolars:${{ matrix.sha_prefix }}${{ github.sha }}
