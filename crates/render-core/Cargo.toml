[package]
name = "render-core"
edition.workspace = true
version.workspace = true

[dependencies]
render-ir.workspace = true
base64 = "0.22"
percent-encoding = "2"
blitz-dom = { version = "0.2.4", features = ["svg"] }
blitz-html = "0.2.0"
blitz-traits = "0.2"
parley = "0.6"
style = { package = "stylo", version = "0.8" }
slab = "0.4"
# O blitz-dom declara `image` com default-features = false, ou seja, sem codec
# nenhum: todo <img> falha com "Could not parse image". Esta dependência existe
# só para ligar os formatos pela unificação de features do cargo — nenhum código
# nosso chama a crate diretamente.
image = { version = "=0.25.6", default-features = false, features = ["png", "jpeg", "webp"] }
# Mesma versão de usvg que o blitz-dom usa (`svg = ["dep:usvg"]`, usvg 0.45.1):
# o `usvg::Tree` devolvido por `svg_data()` precisa ser o mesmo tipo.
# Mesma versao de wuff que o blitz-dom usa no recurso woff-rust: precisamos
# descomprimir os @font-face que ele deixa de buscar (ver src/fonts.rs).
wuff = "0.2.9"
usvg = "0.45.1"
resvg = { version = "0.45.1", default-features = false }
