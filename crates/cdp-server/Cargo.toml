[package]
name = "cdp-server"
edition.workspace = true
version.workspace = true

[dependencies]
render-ir.workspace = true
render-core.workspace = true
paginate.workspace = true
pdf-out.workspace = true
raster-out.workspace = true
base64 = "0.22"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
# Alocador global do binário. Layout e rasterização são cargas de muitas
# alocações pequenas e de vida curta, exatamente onde o malloc do sistema
# (sobretudo o do glibc, que é o da imagem de runtime) fica atrás.
mimalloc = { version = "0.1", default-features = false }
# Profiler de heap, só no exemplo `heap`. Fica opcional porque substitui o
# alocador global: nada que vá para produção pode carregá-lo.
dhat = { version = "0.3", optional = true }

[features]
dhat-heap = ["dep:dhat"]

[[bin]]
name = "cdp-server"
path = "src/main.rs"

[[example]]
name = "heap"
required-features = ["dhat-heap"]
